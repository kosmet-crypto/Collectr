<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="collectr-native-api" content="1">
<meta name="theme-color" content="#101114">
<title>Collectr</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#101114; --bg2:#17181d; --card:#1d1f25; --card2:#252830; --line:#2e313a;
  --tx:#f1f1f3; --tx2:#a6a8b3; --tx3:#6f7280;
  --acc:#ffd84d; --acc2:#f5b81c; --acc-tx:#1b1c22;
  --ok:#4fd18b; --warn:#ffb547; --bad:#ff6b6b; --info:#6aa8ff;
  --r:16px; --r2:12px;
  --shadow:0 8px 30px rgba(0,0,0,.35);
  --img:#ffffff;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4f4f6; --bg2:#ffffff; --card:#ffffff; --card2:#f0f0f3; --line:#e2e3e8;
    --tx:#17181d; --tx2:#5d606b; --tx3:#9295a0;
    --acc:#ffcf1f; --acc2:#e8a400; --acc-tx:#1b1c22;
    --shadow:0 6px 24px rgba(0,0,0,.08);
  }
}
:root[data-theme="light"]{
  --bg:#f4f4f6; --bg2:#ffffff; --card:#ffffff; --card2:#f0f0f3; --line:#e2e3e8;
  --tx:#17181d; --tx2:#5d606b; --tx3:#9295a0;
  --acc:#ffcf1f; --acc2:#e8a400; --acc-tx:#1b1c22;
  --shadow:0 6px 24px rgba(0,0,0,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom));min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc2)}
textarea{min-height:70px;resize:vertical}
h1,h2,h3{margin:0}
.hidden{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.colbtn{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-align:left}
.colicon{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-size:20px;flex:none}
.coltitle{min-width:0}
.coltitle b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coltitle small{color:var(--tx2);font-size:12px}
.chev{color:var(--tx3);font-size:12px;margin-left:2px}

main{padding:4px 16px 24px;max-width:760px;margin:0 auto}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg2);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--tx3);font-size:11px;border-radius:12px}
nav.tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--tx)}
nav.tabs button.on svg{stroke:var(--acc2)}

/* cards & stats */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sec{margin:18px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:12px}
.stat b{display:block;font-size:22px;line-height:1.1}
.stat span{font-size:12px;color:var(--tx2)}
.stat.acc b{color:var(--acc2)}
.hero{display:flex;align-items:center;gap:16px}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:22px}
.hero .t b{font-size:18px;display:block}
.hero .t span{color:var(--tx2);font-size:13px}
.loccard{display:flex;align-items:center;gap:12px}
.loccard .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card2);font-size:19px;flex:none}
.loccard .m{flex:1;min-width:0}
.loccard .m b{display:block}
.loccard .m span{font-size:12px;color:var(--tx2)}
.loccard .q{font-size:22px;font-weight:700}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--tx2);font-weight:600;vertical-align:middle}
.pill.sell{background:rgba(79,209,139,.15);color:var(--ok)}
.pill.store{background:rgba(106,168,255,.15);color:var(--info)}
.pill.warn{background:rgba(255,181,71,.15);color:var(--warn)}
.pill.bad{background:rgba(255,107,107,.15);color:var(--bad)}

/* list rows */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;text-align:left;width:100%}
.row .m{flex:1;min-width:0}
.row .m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m span{display:block;font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m span.pill{display:inline-block;font-size:11px}
.row .r{text-align:right;font-size:13px;color:var(--tx2);flex:none}
.row .r b{display:block;color:var(--tx);font-size:15px}
.bar{height:6px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:99px}
.bar i.full{background:var(--ok)}

/* thumbnails */
.th{width:52px;height:52px;border-radius:10px;background:var(--img);flex:none;display:grid;place-items:center;overflow:hidden;position:relative;border:1px solid var(--line)}
.th img,.gimg img,.bigimg img{width:100%;height:100%;object-fit:contain}
.ph{width:100%;height:100%;display:grid;place-items:center;background:var(--card2);color:var(--tx3);font-size:11px;text-align:center;line-height:1.1;padding:4px}
.ph svg{width:26px;height:26px;fill:currentColor;opacity:.6}

/* grid of items */
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.gi{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:6px 6px 8px;text-align:left;position:relative;min-width:0}
.gi.zero .gimg{opacity:.35;filter:grayscale(1)}
.gimg{aspect-ratio:1;border-radius:9px;background:var(--img);overflow:hidden;display:grid;place-items:center}
.gi b{display:block;font-size:13px;margin-top:6px}
.gi span{display:block;font-size:11px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gi .badge{position:absolute;top:10px;right:10px;background:var(--acc);color:var(--acc-tx);font-weight:700;font-size:12px;min-width:22px;height:22px;border-radius:99px;display:grid;place-items:center;padding:0 6px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.gi .sub{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.gi .sub em{font-style:normal;font-size:10px;padding:1px 6px;border-radius:99px;background:var(--card2);color:var(--tx2)}
.gi .sub em.s{background:rgba(79,209,139,.15);color:var(--ok)}
.gi .dmg{position:absolute;top:10px;left:10px;width:10px;height:10px;border-radius:99px;background:var(--warn);border:2px solid var(--card)}

/* chips & segmented */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--tx2);white-space:nowrap}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:14px;color:var(--tx2);font-weight:600}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.seg.acc button.on{background:var(--acc);color:var(--acc-tx)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:600;font-size:14px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-tx)}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>.btn{flex:1}
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:25;width:56px;height:56px;border-radius:18px;background:var(--acc);color:var(--acc-tx);font-size:28px;display:grid;place-items:center;box-shadow:var(--shadow)}
.link{color:var(--acc2);font-weight:600;font-size:13px}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex:none}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* stepper */
.step{display:flex;align-items:center;gap:0;flex:none;background:var(--card2);border-radius:12px;border:1px solid var(--line)}
.step button{width:42px;height:42px;font-size:22px;font-weight:600;display:grid;place-items:center;border-radius:11px}
.step button:active{background:var(--line)}
.step button.plus{color:var(--acc2)}
.step input{width:46px;text-align:center;border:0;background:transparent;padding:0;font-weight:700;font-size:17px}
.step.sm button{width:34px;height:34px;font-size:18px}
.step.sm input{width:34px;font-size:15px}

/* count rows */
.crow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:8px 8px 8px 8px}
.crow .m{flex:1;min-width:0}
.crow .m b{display:block;font-size:15px}
.crow .m span{display:block;font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .m small{display:block;font-size:11px;color:var(--tx3)}
.crow.has{border-color:color-mix(in srgb,var(--acc2) 45%,var(--line))}

.search{position:relative;margin:4px 0 10px}
.search input{padding-left:38px;border-radius:12px;background:var(--card)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--tx3);fill:none;stroke-width:2}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg2);border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding:10px 16px calc(20px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;overscroll-behavior:contain}
.sheet.on{transform:none}
.sheet:not(.on){visibility:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1),visibility 0s .25s}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-size:19px;margin-bottom:4px}
.sheet .sub{color:var(--tx2);font-size:13px;margin-bottom:12px}
.field{margin:12px 0}
.field label{display:block;font-size:12px;color:var(--tx2);margin-bottom:5px;font-weight:600}
.frow{display:flex;gap:8px}
.frow>*{flex:1;min-width:0}
.bigimg{width:100%;max-width:260px;aspect-ratio:1;margin:0 auto 12px;border-radius:16px;background:var(--img);overflow:hidden;display:grid;place-items:center}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);gap:10px;font-size:14px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--tx2)}
.locblk{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;margin:8px 0}
.locblk .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.condrow{display:flex;align-items:center;justify-content:space-between;padding:4px 0;gap:8px}
.condrow span{font-size:14px;color:var(--tx2)}
.tpl{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.tpl .e{font-size:28px;width:48px;height:48px;border-radius:14px;background:var(--card2);display:grid;place-items:center;flex:none}
.tpl.rec{border-color:var(--acc2);background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 14%,var(--card)),var(--card))}
.tpl b{display:block;font-size:16px}
.tpl span{font-size:13px;color:var(--tx2)}
.check{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.check input{width:20px;height:20px;accent-color:var(--acc2);flex:none}
.check:last-child{border-bottom:0}
.muted{color:var(--tx2);font-size:13px}
.empty{text-align:center;color:var(--tx2);padding:36px 12px}
.empty .e{font-size:40px;margin-bottom:8px}
.welcome h1{font-size:28px;margin:10px 0 4px}
.welcome p{color:var(--tx2);margin:0 0 18px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;opacity:0;transition:.2s;font-size:14px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast button{color:var(--acc2);font-weight:700}
.money{font-variant-numeric:tabular-nums}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.hr{height:1px;background:var(--line);margin:14px 0}
.progress{height:4px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--acc2);width:0;transition:width .2s}
table.map{width:100%;border-collapse:collapse;font-size:13px}
table.map td{padding:6px 4px;border-bottom:1px solid var(--line)}
table.map td:first-child{color:var(--tx2);width:42%}
.stickybar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));background:var(--bg);padding:10px 0 4px;z-index:5}
</style>
</head>
<body>
<header class="top" id="top">
  <button class="colbtn" data-act="colMenu">
    <span class="colicon" id="colIcon">🧱</span>
    <span class="coltitle"><b id="colName">Collectr</b><small id="colSub"></small></span>
    <span class="chev">▼</span>
  </button>
  <button class="iconbtn" data-act="search" aria-label="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
</header>

<main>
  <section id="tab-home" class="view"></section>
  <section id="tab-count" class="view hidden"></section>
  <section id="tab-sale" class="view hidden"></section>
  <section id="tab-move" class="view hidden"></section>
  <section id="tab-set" class="view hidden"></section>
</main>

<nav class="tabs" id="tabs">
  <button data-act="tab" data-tab="home" class="on"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg><span data-t="tabHome"></span></button>
  <button data-act="tab" data-tab="count"><svg viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5"/></svg><span data-t="tabCount"></span></button>
  <button data-act="tab" data-tab="sale"><svg viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8" r="1.5"/></svg><span data-t="tabSale"></span></button>
  <button data-act="tab" data-tab="move"><svg viewBox="0 0 24 24"><path d="M4 8h15l-4-4M20 16H5l4 4"/></svg><span data-t="tabMove"></span></button>
  <button data-act="tab" data-tab="set"><svg viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg><span data-t="tabSet"></span></button>
</nav>

<div class="scrim" id="scrim" data-act="closeSheet"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =========================================================================
   Collectr — collection & stock tracker (LEGO foil packs first).
   Data lives on the device: localStorage (records) + IndexedDB (own photos).
   ========================================================================= */

const APP = window.CollectrAndroid || null;
const REPO = 'kosmet-crypto/Collectr';
const CAT_REMOTE = 'https://raw.githubusercontent.com/' + REPO + '/main/catalog/lego-foil.json';
const CAT_LOCAL = 'catalog/lego-foil.json';
const KEY = 'collectr.v1', CATKEY = 'collectr.catalog', UIKEY = 'collectr.ui';
const CONDS = ['mint', 'opened', 'damaged'];        // best first: the collection keeps the best ones
const MOVE_ORDER = ['damaged', 'opened', 'mint'];   // surplus (worst first) moves and sells first
const CURS = ['NOK', 'EUR', 'RSD', 'USD', 'SEK', 'DKK', 'GBP', 'CHF'];
/* Units of each currency per 1 NOK; used until the first online rate update. */
const FALLBACK_RATES = {NOK: 1, EUR: 0.0855, RSD: 10.02, USD: 0.094, SEK: 0.99, DKK: 0.638, GBP: 0.073, CHF: 0.079};

/* ---------------- i18n ---------------- */
const L = {
  tabHome: ['Преглед', 'Overview'], tabCount: ['Попис', 'Count'], tabSale: ['Продаја', 'Sell'], tabMove: ['Пренос', 'Move'], tabSet: ['Подешавања', 'Settings'],
  loc1: ['Локација 1', 'Location 1'], loc2: ['Локација 2', 'Location 2'],
  mint: ['Минт', 'Mint'], opened: ['Отворена', 'Opened'], damaged: ['Оштећена кесица', 'Damaged pack'],
  mintS: ['минт', 'mint'], openedS: ['отвор.', 'opened'], damagedS: ['оштећ.', 'damaged'],
  welcomeT: ['Добродошао у Collectr', 'Welcome to Collectr'],
  welcomeP: ['Изабери шта скупљаш. Касније можеш додати још колекција.', 'Pick what you collect. You can add more collections later.'],
  recommended: ['Препорука', 'Recommended'],
  completion: ['Попуњеност', 'Completion'],
  ofDistinct: ['{0} од {1} различитих', '{0} of {1} different'],
  pieces: ['Укупно комада', 'Total pieces'], forCollection: ['За колекцију', 'For collection'],
  sellNow: ['Продаја одмах', 'Sell now'], waiting: ['Чека пренос', 'Waiting to move'],
  missingForCol: ['Фали за колекцију', 'Missing for collection'],
  spent: ['Набавна вредност', 'Purchase value'],
  locations: ['Локације', 'Locations'], series: ['Серије', 'Series'], seriesOne: ['Серија', 'Series'],
  sellLoc: ['продаја', 'selling'], storeLoc: ['складиште', 'storage'],
  colSale: ['колекција {0} · продаја {1}', 'collection {0} · for sale {1}'],
  addSeries: ['Нова серија', 'New series'], addItem: ['Додај шифру', 'Add number'],
  all: ['Све', 'All'], have: ['Имам', 'Have'], missing: ['Недостаје', 'Missing'], surplus: ['Вишак', 'Surplus'],
  back: ['Назад', 'Back'], hiddenCodes: ['Обрисане шифре ({0})', 'Removed numbers ({0})'],
  dlImages: ['Преузми слике', 'Download pictures'], rename: ['Преименуј', 'Rename'],
  deleteSeries: ['Обриши серију', 'Delete series'], hideSeries: ['Сакриј серију', 'Hide series'],
  noItems: ['Нема ставки', 'No items'],
  kShort: ['кол.', 'keep'], sShort: ['прод.', 'sell'],

/* Index into the [Serbian, English] pairs; Norwegian uses NB and falls back to English. */
function lang() { const l = S ? S.settings.lang : 'en'; return l === 'sr' ? 0 : l === 'nb' ? 2 : 1; }
function t(k, ...a) {
  const v = lang() === 2 && NB[k] ? NB[k] : L[k] ? L[k][Math.min(lang(), 1)] : k;
  return a.length ? v.replace(/\{(\d)\}/g, (_, i) => a[i]) : v;
}
function tn(pair) { return Array.isArray(pair) ? (pair[lang()] || pair[1]) : pair; }

const $ = s => document.querySelector(s);
function num(v) { const n = parseFloat(String(v).replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : 0; }
function int(v) { return Math.max(0, Math.round(num(v))); }
function locale() { return ['sr-Latn-RS', 'en-GB', 'nb-NO'][lang()]; }
function nf(v, d) { return Number(v || 0).toLocaleString(locale(), {maximumFractionDigits: d == null ? (Math.abs(v) < 100 ? 2 : 0) : d}); }
function money(v, cur) { return nf(v) + ' ' + (cur || S.settings.cur); }
function fdate(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${+d}.${+m}.${y}.`; }
function bytes(n) { return n > 1048576 ? nf(n / 1048576, 1) + ' MB' : nf(n / 1024, 0) + ' KB'; }

/* ---------------- stock math ---------------- */
function qtyAt(it, loc, cond) {
  const s = it.stock && it.stock[loc];
  if (!s) return 0;
  if (cond) return s[cond] || 0;
  return CONDS.reduce((a, c) => a + (s[c] || 0), 0);
}
function keepOrder(it) {
  const first = it.keepLoc || S.settings.keepFirst;
  return S.locations.slice().sort((a, b) => ((b.id === first) - (a.id === first)) || ((a.sell ? 1 : 0) - (b.sell ? 1 : 0)));
}
/** Totals for one item: how many are where, how many stay in the collection and how many can be sold. */
function calc(it) {
  const r = {total: 0, at: {}, keepAt: {}, saleAt: {}, sellNow: 0, waiting: 0};
  for (const l of S.locations) { const q = qtyAt(it, l.id); r.at[l.id] = q; r.total += q; }
  r.target = it.keep != null ? it.keep : S.settings.keep;
  r.keep = Math.min(r.target, r.total);
  r.missing = Math.max(0, r.target - r.total);
  let rem = r.keep;
  for (const l of keepOrder(it)) { const k = Math.min(rem, r.at[l.id]); r.keepAt[l.id] = k; rem -= k; }
  for (const l of S.locations) {
    const s = r.at[l.id] - (r.keepAt[l.id] || 0);
    r.saleAt[l.id] = s;
    if (l.sell) r.sellNow += s; else r.waiting += s;
  }

}
/** Conditions of the pieces for sale at a location (the collection keeps the best ones). */
function saleConds(it, loc, keepN) {

  let k = keepN; const sale = {};
  for (const c of CONDS) { const q = s[c] || 0; const kk = Math.min(k, q); k -= kk; if (q - kk > 0) sale[c] = q - kk; }
  return sale;
}
function condText(obj) { return CONDS.filter(c => obj[c]).map(c => obj[c] + ' ' + t(c + 'S')).join(', '); }
function setQty(it, loc, cond, q) {

}

  let need = -d, done = 0;
  for (const c of [cond].concat(MOVE_ORDER.filter(x => x !== cond))) {
    const q = qtyAt(it, loc, c), take = Math.min(q, need);

}

  for (const l of S.locations) st.loc[l.id] = {q: 0, keep: 0, sale: 0};

  if (ui.sheet && ui.sheet.type === 'item') openItem(ui.sheet.id);
}

function renderWelcome() {
  $('#tab-home').innerHTML = `<div class="welcome">${chips(LANGS, S.settings.lang, 'setLang')}<h1>${t('welcomeT')}</h1><p>${t('welcomeP')}</p>${tplList()}</div>`;
}
function tplList() {
  return TPLS.map(tp => `<button class="tpl${tp.rec ? ' rec' : ''}" data-act="newColTpl" data-tpl="${tp.id}">
    <span class="e">${tp.icon}</span><span><b>${esc(tn(tp.name))} ${tp.rec ? `<span class="pill sell">${t('recommended')}</span>` : ''}</b><span>${esc(tn(tp.desc))}</span></span></button>`).join('');
}

/* ---- overview ---- */
function renderHome() {
  const col = activeCol();
  const el = $('#tab-home');
  if (ui.ser && serById(ui.ser) && serById(ui.ser).col === col.id) { renderSeriesView(el, serById(ui.ser)); return; }
  ui.ser = null;
  const st = colStats(col);
  let h = `<div class="card hero">${ring(st.pct)}<div class="t"><b>${t('completion')}</b><span>${t('ofDistinct', st.owned, st.distinct)}</span>
    ${st.missingKeep ? `<div style="margin-top:6px"><span class="pill warn">${t('missingForCol')}: ${st.missingKeep}</span></div>` : ''}</div></div>
  <div class="grid2" style="margin-top:10px">
    <div class="stat"><b>${st.total}</b><span>${t('pieces')}</span></div>
    <div class="stat"><b>${st.keep}</b><span>${t('forCollection')}</span></div>

  h += `<div class="sec"><h2>${t('locations')}</h2></div><div class="list">` + S.locations.map(l => {
    const s = st.loc[l.id];
    return `<div class="card loccard"><div class="ic">${l.sell ? '🏷️' : '📦'}</div><div class="m"><b>${esc(lname(l))} <span class="pill ${l.sell ? 'sell' : 'store'}">${l.sell ? t('sellLoc') : t('storeLoc')}</span></b>
      <span>${t('colSale', s.keep, s.sale)}</span></div><div class="q">${s.q}</div></div>`;
  }).join('') + '</div>';
  const sers = colSeries(col.id);
  h += `<div class="sec"><h2>${t('series')}</h2><button class="link" data-act="addSeries">+ ${t('addSeries')}</button></div><div class="list">`;
  h += sers.map(s => {
    const ss = serStats(s);
    return `<button class="row" data-act="openSer" data-id="${s.id}"><div class="m"><b>${esc(s.name)}</b><span>${t('seriesPct', ss.owned, ss.n, ss.pct)} · ${ss.total} ${t('pcs')}</span>
      <div class="bar"><i class="${ss.pct >= 100 ? 'full' : ''}" style="width:${ss.pct}%"></i></div></div><div class="r">›</div></button>`;

  h += '</div>';
  el.innerHTML = h;
}
function renderSeriesView(el, ser) {
  const ss = serStats(ser);
  let items = serItems(ser.id).filter(i => matches(i, ui.q));
  const f = ui.filter;
  items = items.filter(it => {
    const r = calc(it);
    return f === 'all' || (f === 'have' && r.total > 0) || (f === 'missing' && r.total === 0) || (f === 'surplus' && r.sale > 0);
  });
  const hiddenN = ser.cat ? Object.keys(S.hidden[ser.col] || {}).filter(c => { const l = catLookup(c); return l && l.series.id === ser.cat; }).length : 0;
  let h = `<div style="display:flex;align-items:center;gap:10px;margin:4px 0 10px">
      <button class="iconbtn" data-act="closeSer" aria-label="back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div style="flex:1;min-width:0"><h2 style="font-size:20px">${esc(ser.name)}</h2><span class="muted">${t('seriesPct', ss.owned, ss.n, ss.pct)} · ${ss.total} ${t('pcs')}</span></div>
      <button class="iconbtn" data-act="serMenu" data-id="${ser.id}" aria-label="menu"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></div>
    <div class="bar" style="margin-bottom:12px"><i class="${ss.pct >= 100 ? 'full' : ''}" style="width:${ss.pct}%"></i></div>
    ${searchBox('serQ', ui.q)}
    ${chips([['all', t('all')], ['have', t('have')], ['missing', t('missing')], ['surplus', t('surplus')]], f, 'filter')}`;
  if (ser.cat && ss.n && ss.owned === 0) h += `<p class="muted" style="margin:0 0 10px">${t('catalogHint')}</p>`;
  h += `<div class="igrid">` + items.map(it => {
    const r = calc(it);
    const dmg = S.locations.some(l => qtyAt(it, l.id, 'damaged') || qtyAt(it, l.id, 'opened'));
    return `<button class="gi${r.total ? '' : ' zero'}" data-act="item" data-id="${it.id}"><div class="gimg">${imgHtml(it)}</div>
      ${r.total ? `<span class="badge">${r.total}</span>` : ''}${dmg ? '<span class="dmg"></span>' : ''}
      <b>${esc(it.code)}</b><span>${esc(it.name || '')}</span>
      ${r.total ? `<div class="sub"><em>${t('kShort')} ${r.keep}</em>${r.sale ? `<em class="s">${t('sShort')} ${r.sale}</em>` : ''}</div>` : ''}</button>`;
  }).join('') + '</div>';
  if (!items.length) h += `<div class="empty"><div class="e">🔍</div>${t('noResults')}</div>`;
  h += `<div class="btns" style="margin-top:14px"><button class="btn" data-act="addItem" data-ser="${ser.id}">+ ${t('addItem')}</button>
    ${hiddenN ? `<button class="btn" data-act="hiddenList" data-ser="${ser.id}">${t('hiddenCodes', hiddenN)}</button>` : ''}</div>`;
  el.innerHTML = h;
}

/* ---- item sheet ---- */

  const it = S.items[id];
  if (!it) { closeSheet(); return; }
  ui.sheet = {type: 'item', id};
  const r = calc(it), ser = serById(it.ser), col = colById(it.col);
  const ac = avgCost(it);
  let h = `<div class="bigimg">${imgHtml(it)}</div>
    <h3>${esc(it.code)} ${it.year ? `<span class="pill">${it.year}</span>` : ''}</h3>
    <div class="sub">${[it.name, ser && ser.name].filter(Boolean).map(esc).join(' · ')}</div>
    <div class="grid2" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat"><b>${r.total}</b><span>${t('total')}</span></div>
      <div class="stat"><b>${r.keep}<small style="font-size:13px;color:var(--tx3)">/${r.target}</small></b><span>${t('collection')}</span></div>
      <div class="stat acc"><b>${r.sale}</b><span>${t('forSale')}</span></div>
    </div>`;
  for (const l of S.locations) {
    h += `<div class="locblk"><div class="h"><b>${esc(lname(l))} <span class="pill ${l.sell ? 'sell' : 'store'}">${l.sell ? t('sellLoc') : t('storeLoc')}</span></b>
      <span class="muted">${t('colSale', r.keepAt[l.id] || 0, r.saleAt[l.id])}</span></div>` +
      CONDS.map(c => `<div class="condrow"><span>${t(c)}</span>${stepper('iq', `data-id="${it.id}" data-loc="${l.id}" data-cond="${c}"`, qtyAt(it, l.id, c), true)}</div>`).join('') + '</div>';
  }
  h += `<div class="locblk"><div class="condrow"><span>${t('keepTarget')}</span>${stepper('keep', `data-id="${it.id}"`, r.target, true)}</div>
    ${it.keep != null ? `<div class="muted" style="text-align:right"><button class="link" data-act="keepReset" data-id="${it.id}">${t('setDefault')} → ${t('keepDefault', S.settings.keep)}</button></div>` : `<div class="muted" style="text-align:right">${t('keepDefault', S.settings.keep)}</div>`}
    <div class="field"><label>${t('keepWhere')}</label><select data-ch="keepLoc" data-id="${it.id}"><option value="">${t('auto')}</option>
      ${S.locations.map(l => `<option value="${l.id}"${it.keepLoc === l.id ? ' selected' : ''}>${esc(lname(l))}</option>`).join('')}</select></div></div>`;
  h += `<div class="btns" style="margin:12px 0"><button class="btn" data-act="buyForm" data-id="${it.id}">+ ${t('addPurchase')}</button>
    <button class="btn pri" data-act="sellForm" data-id="${it.id}" ${r.sellNow ? '' : 'disabled'}>${t('sell')}</button></div>`;
  h += `<div class="sec"><h2>${t('purchases')}</h2>${ac != null ? `<span class="muted">${t('avgCost')}: <b class="money">${money(ac)}</b></span>` : ''}</div>`;
  h += (it.cost || []).length ? '<div class="list">' + it.cost.map(p => `<div class="row"><div class="m"><b>${p.q} × ${nf(p.amt)} ${p.cur}</b><span>${fdate(p.date)} · ${esc(locName(p.loc))}</span></div>
      <div class="r"><b class="money">${money(toBase(p.total, p.base))}</b></div><button class="iconbtn" data-act="delCost" data-id="${it.id}" data-cid="${p.id}"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`).join('') + '</div>' : `<p class="muted">${t('noCost')}</p>`;
  h += `<div class="sec"><h2>${t('photo')}</h2></div><div class="btns"><button class="btn" data-act="photo" data-id="${it.id}">📷 ${t('takePhoto')}</button>
    ${photos[it.id] ? `<button class="btn danger" data-act="photoDel" data-id="${it.id}">${t('removePhoto')}</button>` : ''}</div>
    <div class="field"><label>${t('code')}</label><input data-ch="itCode" data-id="${it.id}" value="${esc(it.code)}"></div>
    <div class="field"><label>${t('name')}</label><input data-ch="itName" data-id="${it.id}" value="${esc(it.name || '')}"></div>
    <div class="field"><label>${t('seriesOne')}</label><select data-ch="itSer" data-id="${it.id}">${colSeries(col.id, true).map(s => `<option value="${s.id}"${s.id === it.ser ? ' selected' : ''}>${esc(s.name)}</option>`).join('')}</select></div>
    <div class="field"><label>${t('imgUrl')}</label><input data-ch="itImg" data-id="${it.id}" value="${esc(it.imgUrl || '')}" placeholder="https://…"></div>
    <div class="field"><label>${t('note')}</label><textarea data-ch="itNote" data-id="${it.id}">${esc(it.note || '')}</textarea></div>
    <button class="btn danger block" data-act="delItem" data-id="${it.id}">${t('deleteItem')}</button>`;
  openSheet(h);
}

/* ---- count ---- */
function renderCount() {
  const col = activeCol();
  const c = ui.count;
  if (!locById(c.loc)) c.loc = (S.locations[0] || {}).id;
  if (!CONDS.includes(c.cond)) c.cond = S.settings.cond;
  const sers = colSeries(col.id);
  if (c.ser !== 'all' && !sers.find(s => s.id === c.ser)) c.ser = 'all';
  const serOrder = new Map(sers.map((s, i) => [s.id, i]));
  let items = (c.ser === 'all' ? colItems(col.id, {visibleOnly: true}) : serItems(c.ser)).filter(i => matches(i, c.q))
    .sort((a, b) => (serOrder.get(a.ser) || 0) - (serOrder.get(b.ser) || 0) || byCode(a, b));
  const here = items.reduce((a, i) => a + qtyAt(i, c.loc), 0);
  let h = `<div class="muted" style="margin:2px 0 6px">${t('counting')}</div>
    <div class="seg acc">${S.locations.map(l => `<button class="${l.id === c.loc ? 'on' : ''}" data-act="cLoc" data-v="${l.id}">${esc(lname(l))}</button>`).join('')}</div>
    <div style="display:flex;align-items:center;gap:8px;margin:10px 0"><span class="muted" style="flex:none">${t('countCond')}</span>
      <div class="seg" style="flex:1">${CONDS.map(k => `<button class="${k === c.cond ? 'on' : ''}" data-act="cCond" data-v="${k}" style="font-size:12px">${t(k + 'S')}</button>`).join('')}</div></div>
    ${chips([['all', t('allSeries')]].concat(sers.map(s => [s.id, s.name])), c.ser, 'cSer')}
    ${searchBox('cQ', c.q)}
    <div class="muted" id="cHere" style="margin:0 0 8px">${t('countedHere', here)}</div><div class="list" id="cList">`;
  h += items.map(countRow).join('') + '</div>';
  if (!items.length) h += `<div class="empty"><div class="e">🔍</div>${t('noResults')}</div>`;
  $('#tab-count').innerHTML = h;
}
function countRow(it) {
  const c = ui.count, q = qtyAt(it, c.loc), r = calc(it);
  const other = S.locations.filter(l => l.id !== c.loc && r.at[l.id]).map(l => `${lname(l)} ${r.at[l.id]}`).join(' · ');
  const bad = qtyAt(it, c.loc, 'damaged') + qtyAt(it, c.loc, 'opened');
  return `<div class="crow${q ? ' has' : ''}" data-row="${it.id}"><button class="th" data-act="item" data-id="${it.id}">${imgHtml(it)}</button>
    <div class="m"><b>${esc(it.code)}</b><span>${esc(it.name || '')}</span><small>${t('total')} ${r.total}${other ? ' · ' + esc(other) : ''}${bad ? ` · <span style="color:var(--warn)">${condText({opened: qtyAt(it, c.loc, 'opened'), damaged: qtyAt(it, c.loc, 'damaged')})}</span>` : ''}</small></div>
    ${stepper('cnt', `data-id="${it.id}"`, q)}</div>`;
}
function refreshCountRow(id) {
  const row = document.querySelector(`[data-row="${id}"]`);
  if (row) row.outerHTML = countRow(S.items[id]);
  const col = activeCol(), c = ui.count;
  const items = (c.ser === 'all' ? colItems(col.id, {visibleOnly: true}) : serItems(c.ser)).filter(i => matches(i, c.q));
  const el = $('#cHere');
  if (el) el.textContent = t('countedHere', items.reduce((a, i) => a + qtyAt(i, c.loc), 0));
}

/* ---- sell ---- */
function renderSale() {
  const col = activeCol();
  const s = ui.sale;
  let h = `<div class="seg" style="margin:4px 0 12px"><button class="${s.mode === 'list' ? 'on' : ''}" data-act="saleMode" data-v="list">${t('toSell')}</button>
    <button class="${s.mode === 'sold' ? 'on' : ''}" data-act="saleMode" data-v="sold">${t('soldList')}</button></div>`;
  if (s.mode === 'sold') { $('#tab-sale').innerHTML = h + soldHtml(col); return; }
  const rows = colItems(col.id).map(it => ({it, r: calc(it)})).filter(x => x.r.sale > 0)
    .filter(x => s.filter === 'all' || (s.filter === 'now' && x.r.sellNow > 0) || (s.filter === 'waiting' && x.r.waiting > 0))
    .sort((a, b) => byCode(a.it, b.it));
  const st = colStats(col);
  h += `<div class="grid2"><div class="stat acc"><b>${st.sellNow}</b><span>${t('sellNow')}</span></div><div class="stat"><b>${st.waiting}</b><span>${t('waiting')}</span></div></div>
    <p class="muted">${t('saleHint', esc(locName(S.settings.keepFirst)))}</p>
    ${chips([['now', t('onlyNow')], ['waiting', t('onlyWaiting')], ['all', t('all')]], s.filter, 'saleFilter')}`;
  if (!rows.length) h += `<div class="empty"><div class="e">🏷️</div><b>${t('nothingToSell')}</b><br>${t('nothingToSellP')}</div>`;
  h += '<div class="list">' + rows.map(({it, r}) => {
    const where = S.locations.filter(l => r.saleAt[l.id] > 0).map(l => `${lname(l)} ${r.saleAt[l.id]}`).join(' · ');
    const conds = {};
    for (const l of S.locations) { const sc = saleConds(it, l.id, r.keepAt[l.id] || 0); for (const k in sc) conds[k] = (conds[k] || 0) + sc[k]; }
    const ac = avgCost(it);
    return `<div class="row"><button class="th" data-act="item" data-id="${it.id}">${imgHtml(it)}</button>
      <div class="m"><b>${esc(it.code)} <span class="pill sell">${r.sale}</span></b><span>${esc(it.name || '')}</span><span>${esc(where)} · ${condText(conds)}${ac != null ? ' · ' + money(ac) + t('perPiece') : ''}</span></div>
      <button class="btn sm pri" data-act="sellForm" data-id="${it.id}" ${r.sellNow ? '' : 'disabled'}>${t('sell')}</button></div>`;
  }).join('') + '</div>';
  if (rows.length) h += `<div style="margin-top:14px"><button class="btn block" data-act="copyList">📋 ${t('copyList')}</button></div>`;
  $('#tab-sale').innerHTML = h;
}
function soldHtml(col) {
  const sales = S.sales.filter(x => x.col === col.id).sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.id > a.id ? 1 : -1));
  let rev = 0, prof = 0, known = false;
  for (const x of sales) { rev += toBase(x.total, x.base); if (x.cost != null) { prof += toBase(x.total - x.cost, x.base); known = true; } }
  let h = `<div class="grid2"><div class="stat"><b class="money">${money(rev)}</b><span>${t('revenue')}</span></div>
    <div class="stat"><b class="money ${prof >= 0 ? 'pos' : 'neg'}">${known ? money(prof) : '—'}</b><span>${t('profit')}</span></div></div><div class="list" style="margin-top:10px">`;
  h += sales.map(x => {
    const it = S.items[x.item];
    const p = x.cost != null ? x.total - x.cost : null;
    return `<div class="row">${it ? `<button class="th" data-act="item" data-id="${it.id}">${imgHtml(it)}</button>` : ''}
      <div class="m"><b>${x.q} × ${esc(x.code)}</b><span>${esc(x.name || '')}</span><span>${fdate(x.date)} · ${esc(x.platform || '')} · ${esc(locName(x.loc))}</span></div>
      <div class="r"><b class="money">${money(x.total, x.base)}</b>${p != null ? `<span class="${p >= 0 ? 'pos' : 'neg'}">${p >= 0 ? '+' : ''}${money(p, x.base)}</span>` : ''}</div>
      <button class="iconbtn" data-act="undoSale" data-id="${x.id}"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button></div>`;
  }).join('') + '</div>';
  if (!sales.length) h += `<div class="empty"><div class="e">🧾</div>${t('nothingHere')}</div>`;
  return h;
}

/* ---- move ---- */
function renderMove() {
  const col = activeCol();
  const m = ui.move;
  if (S.locations.length < 2) {
    $('#tab-move').innerHTML = `<div class="empty"><div class="e">📦</div>${t('needTwoLocs')}<div style="margin-top:14px"><button class="btn" data-act="addLoc">+ ${t('addLoc')}</button></div></div>`;
    return;
  }
  if (!locById(m.from)) m.from = (S.locations.find(l => !l.sell) || S.locations[0]).id;
  if (!locById(m.to) || m.to === m.from) m.to = (S.locations.find(l => l.id !== m.from) || {}).id;
  const opt = sel => S.locations.map(l => `<option value="${l.id}"${l.id === sel ? ' selected' : ''}>${esc(lname(l))}</option>`).join('');
  let h = `<div class="frow" style="align-items:end;margin-top:4px"><div class="field" style="margin:0"><label>${t('from')}</label><select data-ch="mFrom">${opt(m.from)}</select></div>
    <button class="iconbtn" data-act="mSwap" style="flex:none;margin-bottom:2px"><svg viewBox="0 0 24 24"><path d="M4 8h15l-4-4M20 16H5l4 4"/></svg></button>
    <div class="field" style="margin:0"><label>${t('to')}</label><select data-ch="mTo">${opt(m.to)}</select></div></div>
    <p class="muted">${t('moveHint')}</p>
    ${chips([['surplus', t('surplus')], ['all', t('all')]], m.filter, 'mFilter')}`;
  const rows = colItems(col.id).map(it => ({it, r: calc(it)})).filter(x => x.r.at[m.from] > 0 && (m.filter === 'all' || x.r.saleAt[m.from] > 0)).sort((a, b) => byCode(a.it, b.it));
  let selTotal = 0;
  for (const k in m.sel) if (S.items[k]) selTotal += m.sel[k]; else delete m.sel[k];
  h += `<div class="btns" style="margin-bottom:10px"><button class="btn sm" data-act="mPick" data-v="surplus">${t('pickSurplus')}</button><button class="btn sm" data-act="mPick" data-v="all">${t('pickAll')}</button><button class="btn sm" data-act="mPick" data-v="none">${t('clearSel')}</button></div>`;
  h += '<div class="list">' + rows.map(({it, r}) => `<div class="crow${m.sel[it.id] ? ' has' : ''}"><button class="th" data-act="item" data-id="${it.id}">${imgHtml(it)}</button>
    <div class="m"><b>${esc(it.code)}</b><span>${esc(it.name || '')}</span><small>${esc(locName(m.from))}: ${r.at[m.from]} (${t('surplus').toLowerCase()} ${r.saleAt[m.from]})</small></div>
    ${stepper('mq', `data-id="${it.id}"`, m.sel[it.id] || 0)}</div>`).join('') + '</div>';
  if (!rows.length) h += `<div class="empty"><div class="e">📦</div>${t('nothingHere')}</div>`;
  h += `<div class="stickybar"><button class="btn pri block" data-act="doMove" ${selTotal ? '' : 'disabled'}>${t('moveN', selTotal)}: ${esc(locName(m.from))} → ${esc(locName(m.to))}</button></div>`;
  const moves = S.moves.filter(x => x.col === col.id).slice(-30).reverse();
  if (moves.length) {
    h += `<div class="sec"><h2>${t('history')}</h2></div><div class="list">` + moves.map(x => `<div class="row"><div class="m"><b>${x.q} × ${esc(x.code)}</b><span>${fdate(x.date)} · ${esc(locName(x.from))} → ${esc(locName(x.to))}</span></div></div>`).join('') + '</div>';
  }
  $('#tab-move').innerHTML = h;
}

/* ---- settings ---- */
function renderSettings() {
  const col = activeCol();
  const s = S.settings, R = s.rates;
  const cats = CAT ? CAT.series : [];
  const sel = (ch, opts, v) => `<select data-ch="${ch}">${opts.map(([k, l]) => `<option value="${k}"${k === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  let h = `<div class="sec"><h2>${t('collections')}</h2><button class="link" data-act="newCol">+ ${t('newCol')}</button></div><div class="list">` +
    S.collections.map(c => `<div class="row"><span style="font-size:22px">${(TPL[c.tpl] || TPL.custom).icon}</span><div class="m"><b>${esc(c.name)}</b><span>${tn((TPL[c.tpl] || TPL.custom).name)} · ${t('itemsCount', colItems(c.id).length)}</span></div>
      <button class="btn sm" data-act="renCol" data-id="${c.id}">${t('rename')}</button></div>`).join('') + '</div>';
  if (col && TPL[col.tpl] && TPL[col.tpl].cat) {
    h += `<div class="sec"><h2>${t('catalog')}</h2><button class="link" data-act="catUpd">${t('updateNow')}</button></div><div class="card">
      <div class="muted">${CAT && CAT.source === 'seed' ? t('catSeed') : t('catInfo', catItemCount(CAT), cats.length, CAT ? fdate(CAT.generated) : '')}</div>
      <div style="margin-top:6px"><b style="font-size:13px">${t('catSeries')} — ${esc(col.name)}</b></div>` +
      cats.map(cs => `<label class="check"><input type="checkbox" data-ch="catSer" data-v="${cs.id}" ${(col.catSeries || []).includes(cs.id) ? 'checked' : ''}><span style="flex:1">${esc(cs.name)}</span><span class="muted">${cs.items.length}</span></label>`).join('') + '</div>';
  }
  h += `<div class="sec"><h2>${t('locations')}</h2><button class="link" data-act="addLoc">+ ${t('addLoc')}</button></div><div class="list">` +
    S.locations.map(l => `<div class="row"><div class="ic" style="font-size:20px">${l.sell ? '🏷️' : '📦'}</div><div class="m"><b>${esc(lname(l))}</b><span>${l.sell ? t('sellLoc') : t('storeLoc')}</span></div>
      <button class="btn sm" data-act="editLoc" data-id="${l.id}">${t('rename')}</button></div>`).join('') + '</div>';
  h += `<div class="sec"><h2>${t('collection')}</h2></div><div class="card">
    <div class="condrow"><span>${t('defKeep')}<br><small class="muted">${t('defKeepP')}</small></span>${stepper('defKeep', '', s.keep, true)}</div>
    <div class="field"><label>${t('keepFirst')}</label>${sel('keepFirst', S.locations.map(l => [l.id, lname(l)]), s.keepFirst)}<div class="muted" style="margin-top:4px">${t('keepFirstP')}</div></div>
    <div class="field"><label>${t('defCond')}</label>${sel('defCond', CONDS.map(c => [c, t(c)]), s.cond)}</div>
    <div class="field"><label>${t('defPlatform')}</label><input data-ch="defPlatform" value="${esc(s.platform)}" placeholder="Finn, eBay…"></div></div>`;
  const others = CURS.filter(c => c !== s.cur);
  h += `<div class="sec"><h2>${t('rates')}</h2><button class="link" data-act="ratesUpd">${t('updateNow')}</button></div><div class="card">
    <div class="field" style="margin-top:0"><label>${t('mainCur')}</label>${sel('mainCur', CURS.map(c => [c, c]), s.cur)}</div>
    <div class="muted">${R.manual ? t('manualRate') : (R.date ? t('ratesUpd', fdate(R.date)) : t('ratesOffline'))}</div>` +
    ['EUR', 'RSD'].concat(others.filter(c => c !== 'EUR' && c !== 'RSD')).filter(c => c !== s.cur).slice(0, 4).map(c => `<div class="condrow"><span>1 ${c} =</span>
      <input style="width:120px;text-align:right" inputmode="decimal" data-ch="rate" data-cur="${c}" value="${nf(conv(1, c, s.cur), 4)}"><span>${s.cur}</span></div>`).join('') +
    `${R.manual ? `<button class="link" data-act="ratesAuto">${t('ratesAuto')}</button>` : ''}</div>`;
  h += `<div class="sec"><h2>${t('data')}</h2></div><div class="card"><p class="muted" style="margin-top:0">${t('dataInfo')}</p>
    <div class="btns"><button class="btn" data-act="backup">💾 ${t('backup')}</button><button class="btn" data-act="restore">↩ ${t('restoreBk')}</button></div>
    <div class="muted" style="margin:6px 0 12px">${t('lastBackup', S.meta.lastBackup ? fdate(S.meta.lastBackup) : t('never'))}</div>
    <div class="btns"><button class="btn" data-act="exportX">📤 ${t('exportXlsx')}</button><button class="btn" data-act="importX">📥 ${t('importXlsx')}</button></div></div>`;
  h += `<div class="sec"><h2>${t('pictures')}</h2></div><div class="card"><p class="muted" style="margin-top:0">${t('picsInfo')}${APP && APP.imagesSize ? ' · ' + t('picsSize', bytes(APP.imagesSize())) : ''}</p>
    <div class="btns"><button class="btn" data-act="dlAll">⬇ ${t('dlImages')}</button>${APP && APP.clearImages ? `<button class="btn" data-act="clearPics">${t('clearPics')}</button>` : ''}</div></div>`;
  h += `<div class="sec"><h2>${t('app')}</h2></div><div class="card">
    <div class="field" style="margin-top:0"><label>${t('language')}</label>${sel('lang', LANGS, s.lang)}</div>
    <div class="field"><label>${t('theme')}</label>${sel('theme', [['auto', t('themeAuto')], ['dark', t('themeDark')], ['light', t('themeLight')]], s.theme)}</div>
    ${APP ? `<button class="btn block" data-act="checkUpd">🔄 ${t('checkUpd')}</button>` : ''}
    <div class="muted" style="margin-top:10px">${t('version')}: ${esc(APP && APP.getVersion ? APP.getVersion() : 'web')}</div>
    ${APP && APP.updateStatus ? `<div class="muted" style="font-size:12px">${t('lastUpdCheck')}: ${esc(APP.updateStatus())}</div>` : ''}</div>`;
  if (col) h += `<div style="margin-top:18px"><button class="btn danger block" data-act="delCol" data-id="${col.id}">${t('delCol')}: ${esc(col.name)}</button></div>`;
  $('#tab-set').innerHTML = h;
}

/* ---------------- actions ---------------- */
function snapshot(ids) { return ids.map(id => JSON.parse(JSON.stringify(S.items[id]))); }
function restoreSnap(snap) { for (const it of snap) S.items[it.id] = it; save(); render(); }

const ACT = {
  tab(b) {
    // Tapping Overview again goes back from a series to the overview.
    if (b.dataset.tab === 'home' && ui.tab === 'home') ui.ser = null;
    ui.tab = b.dataset.tab; closeSheet(); save(); render(); window.scrollTo(0, 0);
  },
  closeSheet() { closeSheet(); render(); },
  confirmNo() { const p = ui.sheet && ui.sheet.prev; reopenPrev(p); },
  confirmYes() { const s = ui.sheet; if (!s) return; const p = s.prev; closeSheet(); if (p) ui.sheet = p; s.onOk(); if (ui.sheet === p) reopenPrev(p); },
  colMenu() {
    ui.sheet = {type: 'cols'};
    openSheet(`<h3>${t('collections')}</h3><div class="list" style="margin-top:10px">` + S.collections.map(c => `<button class="row" data-act="pickCol" data-id="${c.id}">
      <span style="font-size:22px">${(TPL[c.tpl] || TPL.custom).icon}</span><div class="m"><b>${esc(c.name)}</b><span>${t('itemsCount', colItems(c.id).length)}</span></div>${c.id === S.active ? '✓' : ''}</button>`).join('') +
      `</div><div style="margin-top:12px"><button class="btn block" data-act="newCol">+ ${t('newCol')}</button></div>`);
  },
  pickCol(b) { S.active = b.dataset.id; ui.ser = null; ui.count.ser = 'all'; closeSheet(); save(); render(); },
  newCol() { ui.sheet = {type: 'newcol'}; openSheet(`<h3>${t('newCol')}</h3><div style="margin-top:12px">${tplList()}</div>`); },
  newColTpl(b) {
    const tp = TPL[b.dataset.tpl];
    ui.sheet = {type: 'newcol2', tpl: tp.id};
    let h = `<h3>${tp.icon} ${esc(tn(tp.name))}</h3><div class="field"><label>${t('colName')}</label><input id="ncName" value="${esc(tn(tp.name))}"></div>`;
    if (tp.cat) {
      h += `<div class="sec"><h2>${t('pickSeries')}</h2></div><p class="muted">${t('pickSeriesP')}</p>` +
        (CAT ? CAT.series : []).map(cs => `<label class="check"><input type="checkbox" class="ncSer" value="${cs.id}" ${DEFAULT_CAT_SERIES.includes(cs.id) ? 'checked' : ''}><span style="flex:1">${esc(cs.name)}</span><span class="muted">${cs.items.length}</span></label>`).join('');
    }
    h += `<div style="margin-top:16px"><button class="btn pri block" data-act="createCol">${t('create')}</button></div>`;
    openSheet(h);
  },
  createCol() {
    const tpl = ui.sheet.tpl, tp = TPL[tpl];
    const col = {id: uid(), name: ($('#ncName').value || '').trim() || tn(tp.name), tpl, created: today()};
    if (tp.cat) col.catSeries = [...document.querySelectorAll('.ncSer:checked')].map(x => x.value);
    S.collections.push(col); S.active = col.id; ui.ser = null; ui.tab = 'home';
    if (tp.cat) syncCatalog(col);
    else { S.series.push({id: uid(), col: col.id, name: t('general'), order: 0}); }
    closeSheet(); save(); render();
  },
  renCol(b) {
    const c = colById(b.dataset.id);
    ui.sheet = {type: 'rencol', id: c.id};
    openSheet(`<h3>${t('rename')}</h3><div class="field"><input id="rcName" value="${esc(c.name)}"></div><button class="btn pri block" data-act="renColOk">${t('save')}</button>`);
  },
  renColOk() { const c = colById(ui.sheet.id); c.name = $('#rcName').value.trim() || c.name; closeSheet(); save(); render(); },
  delCol(b) {
    const c = colById(b.dataset.id);
    confirmSheet(t('delColQ', c.name), t('del'), () => {
      for (const id in S.items) if (S.items[id].col === c.id) { DB.del(id); delete photos[id]; delete S.items[id]; }
      S.series = S.series.filter(s => s.col !== c.id);
      S.sales = S.sales.filter(s => s.col !== c.id);
      S.moves = S.moves.filter(s => s.col !== c.id);
      delete S.hidden[c.id];
      S.collections = S.collections.filter(x => x.id !== c.id);
      S.active = S.collections[0] ? S.collections[0].id : null;
      ui.tab = 'home'; ui.ser = null;
      save(); render();
    }, true);
  },
  search() {
    ui.sheet = {type: 'search'};
    openSheet(`<h3>${t('searchAll')}</h3>${searchBox('gQ', '')}<div class="list" id="gRes"></div>`);
    setTimeout(() => { const i = $('#sheet input'); if (i) i.focus(); }, 250);
  },
  openSer(b) { ui.ser = b.dataset.id; ui.filter = 'all'; ui.q = ''; render(); window.scrollTo(0, 0); },
  closeSer() { ui.ser = null; render(); },
  filter(b) { ui.filter = b.dataset.v; render(); },
  item(b) { openItem(b.dataset.id); },
  serMenu(b) {
    const s = serById(b.dataset.id);
    ui.sheet = {type: 'sermenu', id: s.id};
    openSheet(`<h3>${esc(s.name)}</h3><div class="list" style="margin-top:10px">
      <button class="row" data-act="dlSer" data-id="${s.id}"><div class="m"><b>⬇ ${t('dlImages')}</b></div></button>
      <button class="row" data-act="renSer" data-id="${s.id}"><div class="m"><b>✏️ ${t('rename')}</b></div></button>
      ${s.cat ? `<button class="row" data-act="hideSer" data-id="${s.id}"><div class="m"><b>🙈 ${t('hideSeries')}</b></div></button>` : `<button class="row" data-act="delSer" data-id="${s.id}"><div class="m"><b style="color:var(--bad)">🗑 ${t('deleteSeries')}</b></div></button>`}</div>`);
  },
  dlSer(b) { closeSheet(); downloadPictures(serItems(b.dataset.id)); },
  dlAll() { const col = activeCol(); downloadPictures(colItems(col.id, {visibleOnly: true})); },
  clearPics() { if (APP && APP.clearImages) APP.clearImages(''); toast(t('saved')); render(); },
  renSer(b) {
    const s = serById(b.dataset.id);
    ui.sheet = {type: 'renser', id: s.id};
    openSheet(`<h3>${t('rename')}</h3><div class="field"><input id="rsName" value="${esc(s.name)}"></div><button class="btn pri block" data-act="renSerOk">${t('save')}</button>`);
  },
  renSerOk() { const s = serById(ui.sheet.id); s.name = $('#rsName').value.trim() || s.name; closeSheet(); save(); render(); },
  hideSer(b) {
    const s = serById(b.dataset.id), col = colById(s.col);
    col.catSeries = (col.catSeries || []).filter(x => x !== s.cat);
    s.off = true; ui.ser = null; closeSheet(); save(); render();
  },
  delSer(b) {
    const s = serById(b.dataset.id);
    const n = serItems(s.id).length;
    confirmSheet(t('deleteSeries') + ` „${s.name}“ (${t('itemsCount', n)})?`, t('del'), () => {
      for (const it of serItems(s.id)) { DB.del(it.id); delete photos[it.id]; delete S.items[it.id]; }
      S.series = S.series.filter(x => x.id !== s.id);
      ui.ser = null; save(); render();
    }, true);
  },
  addSeries() {
    ui.sheet = {type: 'addser'};
    openSheet(`<h3>${t('addSeries')}</h3><div class="field"><label>${t('seriesName')}</label><input id="asName"></div><button class="btn pri block" data-act="addSeriesOk">${t('create')}</button>`);
    setTimeout(() => $('#asName') && $('#asName').focus(), 250);
  },
  addSeriesOk() {
    const name = $('#asName').value.trim(); if (!name) return;
    const col = activeCol();
    const s = {id: uid(), col: col.id, name, order: colSeries(col.id, true).length};
    S.series.push(s); closeSheet(); ui.ser = s.id; save(); render();
  },
  addItem(b) {
    const s = serById(b.dataset.ser);
    ui.sheet = {type: 'additem', ser: s.id};
    openSheet(`<h3>${t('newItemIn', esc(s.name))}</h3>
      <div class="field"><label>${t('code')}</label><input id="aiCode" autocapitalize="off"></div>
      <div class="field"><label>${t('name')}</label><input id="aiName"></div>
      <div class="field"><label>${t('imgUrl')}</label><input id="aiImg" placeholder="https://…"></div>
      <button class="btn pri block" data-act="addItemOk">${t('create')}</button>`);
    setTimeout(() => $('#aiCode') && $('#aiCode').focus(), 250);
  },
  addItemOk() {
    const code = $('#aiCode').value.trim();
    if (!code) { toast(t('needCode')); return; }
    const s = serById(ui.sheet.ser);
    if (findByCode(s.col, code)) { toast(t('exists', code)); return; }
    const it = newItem(s.col, s.id, code, $('#aiName').value.trim());
    const img = $('#aiImg').value.trim(); if (img) it.imgUrl = img;
    const hit = catLookup(code);
    if (hit && TPL[colById(s.col).tpl].cat) { it.cat = true; it.name = it.name || hit.item.name; it.img = hit.item.img; it.year = hit.item.year; if (it.name !== hit.item.name) it.nameEdited = true; }
    if (S.hidden[s.col]) delete S.hidden[s.col][code];
    save(); render(); openItem(it.id);
  },
  hiddenList(b) {
    const s = serById(b.dataset.ser);
    const codes = Object.keys(S.hidden[s.col] || {}).filter(c => { const l = catLookup(c); return l && l.series.id === s.cat; }).sort();
    ui.sheet = {type: 'hidden', ser: s.id};
    openSheet(`<h3>${t('hiddenCodes', codes.length)}</h3><div class="list" style="margin-top:10px">` + codes.map(c => {
      const l = catLookup(c);
      return `<div class="row"><div class="m"><b>${esc(c)}</b><span>${esc(l ? l.item.name : '')}</span></div><button class="btn sm" data-act="unhide" data-code="${esc(c)}" data-ser="${s.id}">${t('restore')}</button></div>`;
    }).join('') + '</div>');
  },
  unhide(b) {
    const s = serById(b.dataset.ser), col = colById(s.col);
    delete (S.hidden[col.id] || {})[b.dataset.code];
    syncCatalog(col); save(); render();
    ACT.hiddenList({dataset: {ser: s.id}});
  },
  iq(b) {
    const it = S.items[b.dataset.id];
    const d = +b.dataset.d;
    setQty(it, b.dataset.loc, b.dataset.cond, qtyAt(it, b.dataset.loc, b.dataset.cond) + d);
    save(); render();
  },
  keep(b) {
    const it = S.items[b.dataset.id];
    const cur = it.keep != null ? it.keep : S.settings.keep;
    it.keep = Math.max(0, cur + (+b.dataset.d));
    save(); render();
  },
  keepReset(b) { S.items[b.dataset.id].keep = null; save(); render(); },
  delItem(b) {
    const it = S.items[b.dataset.id];
    const r = calc(it);
    const doDel = () => {
      const snap = snapshot([it.id]);
      if (it.cat) { S.hidden[it.col] = S.hidden[it.col] || {}; S.hidden[it.col][it.code] = true; }
      delete S.items[it.id];
      closeSheet(); save(); render();
      toast(t('del') + ': ' + it.code, () => { if (S.hidden[it.col]) delete S.hidden[it.col][it.code]; restoreSnap(snap); });
      DB.del(it.id); delete photos[it.id];
    };
    confirmSheet(r.total ? t('deleteItemStockQ', it.code, r.total) : t('deleteItemQ', it.code), t('del'), doDel, true);
  },
  async photo(b) {
    const id = b.dataset.id;
    const f = await pickFile('image/*');
    if (!f) return;
    try {
      const data = await readPhoto(f);
      photos[id] = data; await DB.put(id, data);
      toast(t('photoSaved')); render();
    } catch (e) { toast(t('badFile')); }
  },
  photoDel(b) { const id = b.dataset.id; delete photos[id]; DB.del(id); render(); },
  delCost(b) {
    const it = S.items[b.dataset.id];
    confirmSheet(t('delPurchaseQ'), t('del'), () => { it.cost = (it.cost || []).filter(p => p.id !== b.dataset.cid); save(); render(); }, true);
  },
  buyForm(b) {
    const it = S.items[b.dataset.id];
    ui.sheet = {type: 'buy', id: it.id};
    const lastCur = localStorage.getItem('collectr.lastCur') || S.settings.cur;
    openSheet(`<h3>${t('addPurchase')}</h3><div class="sub">${esc(it.code)} ${esc(it.name || '')}</div>
      <div class="frow"><div class="field"><label>${t('qty')}</label><input id="bQ" inputmode="numeric" value="1"></div>
        <div class="field"><label>${t('location')}</label><select id="bLoc">${S.locations.map(l => `<option value="${l.id}"${l.id === (ui.count.loc || S.locations[0].id) ? ' selected' : ''}>${esc(lname(l))}</option>`).join('')}</select></div></div>
      <div class="frow"><div class="field"><label>${t('pricePer')}</label><input id="bP" inputmode="decimal" placeholder="0"></div>
        <div class="field"><label>${t('currency')}</label><select id="bC">${CURS.map(c => `<option${c === lastCur ? ' selected' : ''}>${c}</option>`).join('')}</select></div></div>
      <div class="muted" id="bConv"></div>
      <div class="frow"><div class="field"><label>${t('condition')}</label><select id="bCond">${CONDS.map(c => `<option value="${c}"${c === S.settings.cond ? ' selected' : ''}>${t(c)}</option>`).join('')}</select></div>
        <div class="field"><label>${t('date')}</label><input id="bD" type="date" value="${today()}"></div></div>
      <div class="btns" style="margin-top:8px"><button class="btn" data-act="backToItem">${t('cancel')}</button><button class="btn pri" data-act="buyOk">${t('save')}</button></div>`);
  },
  backToItem() { openItem(ui.sheet.id); },
  buyOk() {
    const it = S.items[ui.sheet.id];
    const q = int($('#bQ').value); if (!q) return;
    const amt = num($('#bP').value), cur = $('#bC').value, loc = $('#bLoc').value, cond = $('#bCond').value, date = $('#bD').value || today();
    localStorage.setItem('collectr.lastCur', cur);
    const snap = snapshot([it.id]);
    addQty(it, loc, cond, q);
    if (amt > 0) { it.cost = it.cost || []; it.cost.push({id: uid(), q, amt, cur, base: S.settings.cur, total: conv(amt * q, cur, S.settings.cur), date, loc}); }
    save(); openItem(it.id); render();
    toast(t('addedToStock'), () => restoreSnap(snap));
  },
  sellForm(b) {
    const it = S.items[b.dataset.id];
    const r = calc(it);
    const locs = S.locations.filter(l => l.sell && r.saleAt[l.id] > 0);
    if (!locs.length) return;
    ui.sheet = {type: 'sell', id: it.id};
    const ac = avgCost(it);
    openSheet(`<h3>${t('sell')}</h3><div class="sub">${esc(it.code)} ${esc(it.name || '')} · ${t('sellNow')}: ${r.sellNow}</div>
      <div class="frow"><div class="field"><label>${t('qty')}</label><input id="sQ" inputmode="numeric" value="1"></div>
        <div class="field"><label>${t('location')}</label><select id="sLoc">${locs.map(l => `<option value="${l.id}">${esc(lname(l))} (${r.saleAt[l.id]})</option>`).join('')}</select></div></div>
      <div class="frow"><div class="field"><label>${t('soldFor')}</label><input id="sP" inputmode="decimal" placeholder="0"></div>
        <div class="field"><label>${t('currency')}</label><select id="sC">${CURS.map(c => `<option${c === S.settings.cur ? ' selected' : ''}>${c}</option>`).join('')}</select></div></div>
      ${ac != null ? `<div class="muted">${t('avgCost')}: ${money(ac)}${t('perPiece')}</div>` : ''}
      <div class="frow"><div class="field"><label>${t('platform')}</label><input id="sW" value="${esc(S.settings.platform)}" placeholder="Finn, eBay…"></div>
        <div class="field"><label>${t('date')}</label><input id="sD" type="date" value="${today()}"></div></div>
      <div class="btns" style="margin-top:8px"><button class="btn" data-act="backToItem">${t('cancel')}</button><button class="btn pri" data-act="sellOk">${t('sell')}</button></div>`);
  },
  sellOk() {
    const it = S.items[ui.sheet.id];
    const r = calc(it);
    const loc = $('#sLoc').value, q = int($('#sQ').value);
    if (!q) return;
    if (q > r.saleAt[loc]) { toast(t('notEnough')); return; }
    const price = num($('#sP').value), cur = $('#sC').value;
    const ac = avgCost(it);
    // Sell the surplus pieces: the collection keeps the best condition, so take the worst first.
    const taken = takeQty(it, loc, q, MOVE_ORDER);
    const total = conv(price * q, cur, S.settings.cur);
    S.sales.push({id: uid(), col: it.col, item: it.id, code: it.code, name: it.name, q, price, cur, base: S.settings.cur, total,
      cost: ac != null ? ac * q : null, date: $('#sD').value || today(), platform: $('#sW').value.trim(), loc, taken});

/* Android back button: close a sheet, leave a series, then go to the overview. */
window.collectrBack = function () {
  if (ui.sheet) {
    const p = ui.sheet.prev || (['buy', 'sell'].includes(ui.sheet.type) ? {type: 'item', id: ui.sheet.id} : null);
    if (p && p.type === 'item') { openItem(p.id); return true; }
    closeSheet(); render(); return true;
  }
  if (ui.tab === 'home' && ui.ser) { ui.ser = null; render(); return true; }
  if (ui.tab !== 'home' && activeCol()) { ui.tab = 'home'; render(); return true; }
  return false;
};

async function doBackup() {

async function doRestore() {

function loadXLSX() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'vendor/xlsx.full.min.js'; s.onload = res; s.onerror = rej;

function exportRows(col) {
  const head = [t('code'), t('name'), t('seriesOne')].concat(S.locations.map(l => lname(l)), [t('total'), t('keepTarget'), t('collection'), t('forSale'), t('sellNow'), t('condition'), t('avgCost') + ' (' + S.settings.cur + ')', t('note')]);
  const rows = [head];
  const sers = colSeries(col.id, true);
  const order = new Map(sers.map((s, i) => [s.id, i]));
  const items = colItems(col.id).sort((a, b) => (order.get(a.ser) || 0) - (order.get(b.ser) || 0) || byCode(a, b));
  for (const it of items) {
    const r = calc(it);
    const conds = {};
    for (const l of S.locations) for (const c of CONDS) conds[c] = (conds[c] || 0) + qtyAt(it, l.id, c);
    const ac = avgCost(it);
    rows.push([it.code, it.name || '', (serById(it.ser) || {}).name || ''].concat(S.locations.map(l => r.at[l.id]),
      [r.total, r.target, r.keep, r.sale, r.sellNow, condText(conds), ac != null ? Math.round(ac * 100) / 100 : '', it.note || '']));
  }
  return rows;
}

const GUESS = {
  code: /^(šifra|sifra|шифра|code|number|broj|број|set|set ?num|item|no\.?|#)$/i,
  name: /^(naziv|назив|name|ime|име|figura|фигура|opis|опис)$/i,
  series: /^(serija|serije|серија|серије|series|theme|tema|тема)$/i,
  cond: /^(stanje|стање|condition|cond)$/i,
  keep: /(циљ|cilj|target|keep|за колекцију|za kolekciju)/i,
  price: /^(cena|цена|price|nabavna cena|набавна цена|purchase price)$/i,
  currency: /^(valuta|валута|currency|cur)$/i,
  note: /^(napomena|напомена|note|notes)$/i,
};
function parseCond(v) {
  v = String(v || '').toLowerCase();
  if (/\d/.test(v)) return null;  // a breakdown like "3 mint, 1 damaged" (our own export): use the default
  if (/ošte|oste|оште|damag|rup|рупи/.test(v)) return 'damaged';
  if (/otvor|отвор|open/.test(v)) return 'opened';
  if (/mint|минт|nov|нов|sealed/.test(v)) return 'mint';
  return null;
}
async function doImport() {
  const f = await pickFile('.xlsx,.xls,.csv,.ods,.json');
  if (!f) return;
  if (/\.json$/i.test(f.name)) { toast(t('badFile')); return; }
  try { await loadXLSX(); } catch (e) { toast('Excel?'); return; }
  let rows;
  try {
    const wb = XLSX.read(await f.arrayBuffer(), {type: 'array'});
    rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1, defval: '', raw: false});
  } catch (e) { toast(t('badFile')); return; }
  rows = rows.filter(r => r.some(c => String(c).trim() !== ''));
  if (rows.length < 2) { toast(t('badFile')); return; }
  const head = rows[0].map(h => String(h).trim());
  const map = {};
  const used = new Set();
  const guess = (field, re) => { const i = head.findIndex((h, k) => !used.has(k) && re.test(h)); if (i >= 0) { map[field] = i; used.add(i); } };
  guess('code', GUESS.code);
  if (map.code == null) { map.code = 0; used.add(0); }
  const reEsc = x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  for (const l of S.locations) {
    // Default locations match their name in any language.
    const names = [lname(l)].concat(l.key && L[l.key] ? L[l.key].concat(NB[l.key] || []) : []);
    guess('loc:' + l.id, new RegExp('^(' + names.filter(Boolean).map(reEsc).join('|') + ')$', 'i'));
  }
  for (const k of ['name', 'series', 'cond', 'keep', 'price', 'currency', 'note']) guess(k, GUESS[k]);
  ui.sheet = {type: 'import', rows, head, map, mode: 'set'};
  const col = activeCol();
  const fields = [['code', t('code')], ['name', t('name')], ['series', t('seriesOne')]].concat(S.locations.map(l => ['loc:' + l.id, t('qtyIn', lname(l))]),
    [['cond', t('condition')], ['keep', t('keepTarget')], ['price', t('pricePer')], ['currency', t('currency')], ['note', t('note')]]);
  const opts = v => `<option value="">${t('none')}</option>` + head.map((h, i) => `<option value="${i}"${v === i ? ' selected' : ''}>${esc(h || '#' + (i + 1))}</option>`).join('');
  openSheet(`<h3>${t('importTitle')}</h3><div class="sub">${t('importInto', esc(col.name))}. ${t('importP', rows.length - 1)}</div>
    <table class="map">${fields.map(([k, label]) => `<tr><td>${esc(label)}</td><td><select class="imMap" data-k="${k}">${opts(map[k])}</select></td></tr>`).join('')}</table>
    <div class="field"><label>${t('importMode')}</label><div class="seg"><button class="on" id="imSet" onclick="imMode(this,'set')">${t('modeSet')}</button><button id="imAdd" onclick="imMode(this,'add')">${t('modeAdd')}</button></div></div>
    <button class="btn pri block" data-act="importOk">${t('importTitle')}</button>`);
}
window.imMode = function (b, m) { ui.sheet.mode = m; document.querySelectorAll('#imSet,#imAdd').forEach(x => x.classList.toggle('on', x === b)); };
function runImport() {
  const s = ui.sheet, col = activeCol();
  const map = {};
  document.querySelectorAll('.imMap').forEach(el => { if (el.value !== '') map[el.dataset.k] = +el.value; });
  if (map.code == null) { toast(t('needCode')); return; }
  const cell = (row, k) => map[k] == null ? '' : String(row[map[k]] == null ? '' : row[map[k]]).trim();
  let added = 0, updated = 0;
  const isCat = TPL[col.tpl] && TPL[col.tpl].cat;
  for (const row of s.rows.slice(1)) {
    const code = cell(row, 'code').replace(/-1$/, '');
    if (!code) continue;
    let it = findByCode(col.id, code);
    if (!it) {
      let ser = null;
      const hit = isCat ? catLookup(code) : null;
      if (hit) {
        ser = S.series.find(x => x.col === col.id && x.cat === hit.series.id);
        if (!ser) { col.catSeries = [...new Set((col.catSeries || []).concat(hit.series.id))]; syncCatalog(col); ser = S.series.find(x => x.col === col.id && x.cat === hit.series.id); }
        if (S.hidden[col.id]) delete S.hidden[col.id][code];
        it = findByCode(col.id, code);
      }
      if (!it) {
        const sname = cell(row, 'series') || t('imported');
        ser = ser || S.series.find(x => x.col === col.id && x.name.toLowerCase() === sname.toLowerCase());
        if (!ser) { ser = {id: uid(), col: col.id, name: sname, order: colSeries(col.id, true).length}; S.series.push(ser); }
        it = newItem(col.id, ser.id, code, cell(row, 'name'));
        if (hit) { it.cat = true; it.name = it.name || hit.item.name; it.img = hit.item.img; }
      }
      added++;
    } else updated++;
    const nm = cell(row, 'name'); if (nm && nm !== it.name) { it.name = nm; it.nameEdited = true; }
    const cond = parseCond(cell(row, 'cond')) || S.settings.cond;
    let qsum = 0, lastLoc = null;
    for (const l of S.locations) {
      if (map['loc:' + l.id] == null) continue;
      const raw = cell(row, 'loc:' + l.id);
      if (raw === '' && s.mode === 'add') continue;
      const q = int(raw);
      // Replace: only the difference changes, so conditions already recorded stay as they are.
      if (s.mode === 'set') { const cur = qtyAt(it, l.id); if (q !== cur) addQty(it, l.id, cond, q - cur); } else if (q) addQty(it, l.id, cond, q);
      qsum += q; if (q) lastLoc = l.id;
    }
    const kp = cell(row, 'keep'); if (kp !== '') it.keep = int(kp);
    const nt = cell(row, 'note'); if (nt) it.note = nt;
    const pr = num(cell(row, 'price'));
    if (pr > 0 && qsum > 0) {
      const cur = (cell(row, 'currency') || S.settings.cur).toUpperCase();
      const c = CURS.includes(cur) ? cur : S.settings.cur;
      it.cost = it.cost || [];
      it.cost.push({id: uid(), q: qsum, amt: pr, cur: c, base: S.settings.cur, total: conv(pr * qsum, c, S.settings.cur), date: today(), loc: lastLoc || S.locations[0].id});
    }
  }
  closeSheet(); save(); render();
  toast(t('importDone', added, updated), null, 4000);
}

/* ---------------- start ---------------- */
async function start() {
  load();
  if (APP && APP.setLang) APP.setLang(S.settings.lang);
  render();
  // Tell the app right away that this page works (a downloaded page that stays silent is rolled back).
  if (APP && APP.ready) APP.ready();
  await Promise.all([DB.open().then(async () => { photos = await DB.all(); }), loadCatalog()]);
  S.collections.filter(c => TPL[c.tpl] && TPL[c.tpl].cat).forEach(syncCatalog);
  render();
  setTimeout(() => { updateCatalog(false); updateRates(false); }, 1500);
}
start();

if ('serviceWorker' in navigator && !APP && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
